name: Deploy Vetra na Fly.io

on:
  push:
    branches:
      - main  # ou 'master', dependendo do nome da sua branch principal

jobs:
  deploy:
    name: Deploy da Aplicação
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Setup Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Reduzir para uma máquina por processo antes do deploy
        run: |
          flyctl scale count 1 --process-group backend --yes
          flyctl scale count 1 --process-group frontend --yes
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Executar Deploy
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Diagnóstico Fly.io (somente se o deploy falhar)
        if: failure()
        continue-on-error: true
        run: |
          echo "::group::fly status"
          flyctl status --app vetra-data-agent || true
          echo "::endgroup::"
          echo "::group::fly machine list"
          flyctl machine list --app vetra-data-agent || true
          echo "::endgroup::"
          for id in $(flyctl machine list --app vetra-data-agent --json | python3 -c "import sys,json; print(' '.join(m['id'] for m in json.load(sys.stdin)))"); do
            echo "::group::machine status $id"
            flyctl machine status "$id" --app vetra-data-agent || true
            echo "::endgroup::"
          done
          echo "::group::fly logs (backend)"
          flyctl logs --app vetra-data-agent --no-tail || true
          echo "::endgroup::"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Confirmar uma máquina por processo
        run: |
          flyctl scale count 1 --process-group backend --yes
          flyctl scale count 1 --process-group frontend --yes
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
