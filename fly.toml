app = "vetra-data-agent"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

[env]
  PYTHONUNBUFFERED = "1"
  VETRA_API_URL = "http://backend.process.vetra-data-agent.internal:8000"
  STREAMLIT_SERVER_HEADLESS = "true"
  STREAMLIT_SERVER_MAXUPLOADSIZE = "10"
  STREAMLIT_SERVER_MAXMESSAGESIZE = "32"
  VETRA_OCR_LANG = "por+eng"
  VETRA_MAX_UPLOAD_BYTES = "10485760"
  VETRA_MAX_ATTACHMENT_BYTES = "10485760"
  VETRA_MAX_TOTAL_ATTACHMENT_BYTES = "26214400"
  VETRA_MAX_ATTACHMENTS = "10"
  VETRA_MAX_ATTACHMENT_TEXT_CHARS = "100000"
  VETRA_MAX_PDF_PAGES = "500"
  VETRA_MAX_TEXTO_RAG = "90000"

# Declaração dos dois processos isolados em VMs separadas no Fly.io
[processes]
  backend = "python -m uvicorn utils.meu_agente_dados.main:app --host 0.0.0.0 --port 8000"
  frontend = "python -m streamlit run utils/meu_agente_dados/app.py --server.port 8501 --server.address 0.0.0.0"

# O Streamlit guarda a sessão em memória e o Fly não tem afinidade de sessão:
# mantenha 1 máquina de frontend (fly deploy --ha=false; fly scale count frontend=1),
# senão o upload de anexos falha com HTTP 400 ("Invalid session_id").
# Rota pública exposta na internet (aponta exclusivamente para o Streamlit na porta 8501)
[http_service]
  processes = ["frontend"]
  internal_port = 8501
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    hard_limit = 25
    soft_limit = 20

  [[http_service.checks]]
    grace_period = "30s"
    interval = "15s"
    method = "get"
    path = "/_stcore/health"
    timeout = "5s"

[checks]
  [checks.backend]
    grace_period = "60s"
    interval = "30s"
    method = "get"
    path = "/health"
    port = 8000
    processes = ["backend"]
    timeout = "5s"
    type = "http"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "1gb"