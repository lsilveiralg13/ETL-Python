app = "vetra-data-agent"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

[env]
  PYTHONUNBUFFERED = "1"
  VETRA_API_URL = "http://127.0.0.1:8000"

[http_service]
  internal_port = 8501
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    hard_limit = 25
    soft_limit = 20

# Health check explícito na rota nativa do Streamlit
[[services.checks]]
  grace_period = "10s"
  interval = "15s"
  method = "get"
  path = "/_stcore/health"
  port = 8501
  timeout = "2s"
  type = "http"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024