app = "vetra-data-agent"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

[env]
  PYTHONUNBUFFERED = "1"
  # O Streamlit vai acessar o FastAPI via interface interna do Fly ou binding local do host
  VETRA_API_URL = "http://0.0.0.0:8000"

# Declaração dos processos isolados gerenciados pela Fly.io (sem start.sh)
[processes]
  backend = "python -m uvicorn utils.meu_agente_dados.main:app --host 0.0.0.0 --port 8000"
  frontend = "python -m streamlit run utils/meu_agente_dados/app.py --server.port 8501 --server.address 0.0.0.0"

# Rota pública exposta na web (aponta exclusivamente para o Frontend)
[http_service]
  processes = ["frontend"]
  internal_port = 8501
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    hard_limit = 25
    soft_limit = 20

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024