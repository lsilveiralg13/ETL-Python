app = "vetra-data-agent"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

[env]
  PYTHONUNBUFFERED = "1"
  # CORREÇÃO 1: Usa o DNS interno privado do Fly.io para conectar os dois processos
  # Formato: http://<processo_backend>.process.<nome_do_app>.internal:8000
  VETRA_API_URL = "http://backend.process.vetra-data-agent.internal:8000"

# Declaração dos processos isolados gerenciados pela Fly.io
[processes]
  backend = "python -m uvicorn utils.meu_agente_dados.main:app --host 0.0.0.0 --port 8000"
  frontend = "python -m streamlit run utils/meu_agente_dados/app.py --server.port 8501 --server.address 0.0.0.0"

# Rota pública exposta na web (aponta exclusivamente para o Frontend)
[http_service]
  processes = ["frontend"]
  internal_port = 8501
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    hard_limit = 25
    soft_limit = 20

# CORREÇÃO 2: Healthcheck isolado por processo para o Fly não derrubar o backend à toa
[[checks]]
  processes = ["backend"]
  type = "http"
  port = 8000
  path = "/health"
  interval = "15s"
  timeout = "5s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024