services:
  backend:
    build:
      context: ../..
      dockerfile: Dockerfile
    command:
      - python
      - -m
      - uvicorn
      - utils.meu_agente_dados.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    env_file:
      - ../../.env
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - http://localhost:8000/health
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  frontend:
    build:
      context: ../..
      dockerfile: Dockerfile
    command:
      - python
      - -m
      - streamlit
      - run
      - utils/meu_agente_dados/app.py
      - --server.port
      - "8501"
      - --server.address
      - 0.0.0.0
    depends_on:
      backend:
        condition: service_healthy
    environment:
      VETRA_API_URL: http://backend:8000
    env_file:
      - ../../.env
    ports:
      - "8501:8501"
    restart: unless-stopped